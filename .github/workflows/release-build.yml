name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 3.1.0)'
        required: true
        default: '3.0.0'

jobs:
  release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version_name }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> local.properties

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace

      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/HelaSacco-v${VERSION}-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Hela Smart SACCO v${{ steps.version.outputs.version }}
          body: |
            ## Hela Smart SACCO v${{ steps.version.outputs.version }}

            ### What's included
            - Full SACCO management system
            - Member registration & KYC workflow
            - Loan applications & repayment schedules
            - Deposits, withdrawals & transfers
            - AI Assistant (Claude-powered)
            - Investment portfolio tracking
            - Reports dashboard

            ### Installation
            Download the APK below and install on Android 7.0+.
            Enable "Install from unknown sources" in Settings if prompted.
          files: app/build/outputs/apk/release/HelaSacco-v${{ steps.version.outputs.version }}-release.apk
          draft: false
          prerelease: false

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelaSacco-v${{ steps.version.outputs.version }}-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
